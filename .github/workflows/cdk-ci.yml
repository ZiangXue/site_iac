name: CDK CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  AWS_ACCOUNT: "310697203246"
  AWS_REGION: us-east-1
  DEPLOY_ENV: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Synthesize CDK
        run: npx cdk synth

  plan:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ matrix.deploy_env }}
    strategy:
      matrix:
        deploy_env: [staging, prod]
    if: ${{ matrix.deploy_env == 'staging' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    env:
      DEPLOY_ENV: ${{ matrix.deploy_env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder plan step
        run: echo "Plan stage placeholder for $DEPLOY_ENV"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ matrix.deploy_env }}
    strategy:
      matrix:
        deploy_env: [staging, prod]
    if: ${{ matrix.deploy_env == 'staging' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    env:
      DEPLOY_ENV: ${{ matrix.deploy_env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder deploy step
        run: echo "Deploy stage placeholder for $DEPLOY_ENV"
